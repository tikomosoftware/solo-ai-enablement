<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>問い合わせ受付</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <h1>問い合わせ受付</h1>
    <p class="lead">内容に近い種別を選んでから送信してください。</p>

    <section class="panel" aria-labelledby="type-heading">
      <h2 id="type-heading">問い合わせ種別</h2>
      <div class="options">
        <button type="button" data-type="一般">一般</button>
        <button type="button" data-type="請求">請求</button>
        <button type="button" data-type="不具合">不具合</button>
      </div>
      <p id="selected-type" class="selected">選択済み: 一般</p>
    </section>

    <button class="submit" type="button">送信</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
