<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>調査用プロンプト</title>
  <style>
    :root {
      color-scheme: light;
      --text: #1f2933;
      --muted: #5b6773;
      --border: #d8dee6;
      --surface: #ffffff;
      --code: #f4f6f8;
      --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Yu Gothic", "Meiryo", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.75;
      color: var(--text);
      background: var(--surface);
    }
    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 64px;
    }
    nav {
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
    }
    nav a { color: var(--accent); text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    .doc-version {
      margin: -20px 0 28px;
      color: var(--muted);
      font-size: 14px;
    }
    h1, h2, h3, h4, h5, h6 {
      line-height: 1.35;
      margin: 1.65em 0 0.65em;
      letter-spacing: 0;
    }
    h1 {
      margin-top: 0;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      font-size: 32px;
    }
    h2 { font-size: 24px; }
    h3 { font-size: 19px; }
    p, ul, pre { margin: 0 0 1.1em; }
    ul { padding-left: 1.4em; }
    li + li { margin-top: 0.25em; }
    a { color: var(--accent); }
    code {
      padding: 0.12em 0.35em;
      border-radius: 4px;
      background: var(--code);
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.92em;
    }
    pre {
      overflow-x: auto;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--code);
      line-height: 1.55;
    }
    pre code {
      padding: 0;
      background: transparent;
      border-radius: 0;
    }
  </style>
</head>
<body>
  <main>
    <nav><a href="../../index.html">記事一覧</a> / 調査用プロンプト</nav>
    <div class="doc-version">資料バージョン 0.5</div>
    <h1>調査用プロンプト</h1>
<pre><code class="language-text">まず関連ファイルを調査してください。
変更はまだ行わず、以下を整理してください。

- 関連ファイル
- 現在の処理の流れ
- 変更候補
- 影響範囲
- 確認すべきリスク
- 実装前に人間へ確認すべきこと</code></pre>
  </main>
</body>
</html>
